<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="225" viewBox="0 0 1000 225" role="img" aria-label="Osama Mohammed — Flutter Developer &amp; Mobile Engineer">
  <title>Osama Mohammed — Flutter Developer &amp; Mobile Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.5" stop-color="#101C33"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.9" r="0.62">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="225" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="225" fill="url(#bg)"/>
    <rect width="1000" height="225" fill="url(#dots)"/>
    <rect width="1000" height="225" fill="url(#glowA)"/>
    <rect width="1000" height="225" fill="url(#glowB)"/>
    <rect y="221" width="1000" height="4" fill="url(#edge)" opacity="0.85"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="223.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <g font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" text-anchor="middle">
    <text x="500" y="60" font-size="13" font-weight="600" letter-spacing="4.6" fill="#7DD3FC" fill-opacity="0.95">MOBILE ENGINEER</text>
    <text x="500" y="118" font-size="46" font-weight="700" letter-spacing="1.4" fill="#F8FAFC">Osama Mohammed</text>
    <text x="500" y="168" font-size="19" font-weight="500" fill="#9FB3D1">Flutter Developer · Native Bridges · Clean Architecture</text>
    <text x="500" y="197" font-size="14" font-weight="400" fill="#64748B">Building production mobile apps that ship to the App Store and Google Play</text>
  </g>
  <rect x="420" y="139" width="160" height="1.6" fill="url(#rule)"/>
</svg>
